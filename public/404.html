<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>This wing is closed · %SITE_NAME%</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="%THEME_COLOR%" />
    <link rel="icon" href="%SITE_URL%favicon.ico" sizes="32x32" />
    <link rel="icon" href="%SITE_URL%favicon.svg" type="image/svg+xml" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%GA_MEASUREMENT_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '%GA_MEASUREMENT_ID%');
    </script>
    <style>
      :root {
        --ink: #0b0e14;
        --gold: #c8a24b;
        --gold-2: #a8843a;
        --text: #e8e2d2;
        --muted: #9aa0b4;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(1200px 700px at 50% 38%, #141a2a, var(--ink));
        color: var(--text);
        font-family: system-ui, -apple-system, sans-serif;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-content: center;
        text-align: center;
        padding: 2rem 1.5rem;
      }
      .placard {
        max-width: 32.5rem;
        border: 1px solid rgba(200, 162, 75, 0.35);
        border-radius: 3px;
        background: rgba(11, 14, 20, 0.6);
        padding: 2.5rem 2rem;
      }
      .mark {
        display: block;
        width: 72px;
        height: 72px;
        margin: 0 auto 1.6rem;
      }
      .eyebrow {
        font-size: 0.7rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--gold-2);
      }
      h1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 500;
        font-size: clamp(1.6rem, 5vw, 2.3rem);
        letter-spacing: 0.05em;
        margin: 0.9rem 0 0;
      }
      .rule {
        width: 3rem;
        height: 1px;
        background: var(--gold);
        margin: 1.4rem auto;
        opacity: 0.7;
      }
      p {
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.65;
        margin: 0;
      }
      a.back {
        display: inline-block;
        margin-top: 1.8rem;
        padding: 0.65rem 1.4rem;
        border: 1px solid var(--gold);
        border-radius: 2px;
        color: var(--gold);
        text-decoration: none;
        font-size: 0.78rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        transition: background 0.2s, color 0.2s;
      }
      a.back:hover, a.back:focus-visible {
        background: var(--gold);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="placard">
        <!-- inlined copy of src/assets/brand/galerium-mark.svg (no extra request) -->
        <svg class="mark" viewBox="0 0 32 32" width="72" height="72" role="img" aria-label="Galerium">
          <title>Galerium</title>
          <defs>
            <clipPath id="tile"><rect width="32" height="32" rx="7"/></clipPath>
            <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fffaee"/><stop offset=".45" stop-color="#f3d692"/><stop offset="1" stop-color="#c8a24b"/>
            </linearGradient>
            <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#4a3720"/><stop offset="1" stop-color="#0e0b08"/>
            </linearGradient>
            <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f7e2ad" stop-opacity=".6"/><stop offset="1" stop-color="#f7e2ad" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <g clip-path="url(#tile)">
            <rect width="32" height="32" fill="#0e1320"/>
            <path d="M0 0 L9.2 8.4 V24.2 L0 32 Z" fill="#1c2540"/>
            <path d="M32 0 L22.8 8.4 V24.2 L32 32 Z" fill="#151c30"/>
            <path d="M9.2 24.2 H22.8 L32 32 H0 Z" fill="url(#floor)"/>
            <path d="M10.6 9.4 a5.4 5.4 0 0 1 10.8 0 V24.2 H10.6 Z" fill="#c8a24b"/>
            <path d="M12.2 10.3 a3.8 3.8 0 0 1 7.6 0 V24.2 H12.2 Z" fill="url(#glow)"/>
            <path d="M12.2 24.2 H19.8 L24.2 32 H7.8 Z" fill="url(#beam)"/>
            <g fill="#e0b657">
              <path d="M2.2 11.4 L8.0 15.1 V22.6 L2.2 26.0 Z"/>
              <path d="M29.8 11.4 L24.0 15.1 V22.6 L29.8 26.0 Z"/>
            </g>
            <g fill="#0f1526">
              <path d="M3.6 13.6 L6.6 15.8 V21.8 L3.6 23.8 Z"/>
              <path d="M28.4 13.6 L25.4 15.8 V21.8 L28.4 23.8 Z"/>
            </g>
            <g fill="#f0d08a" opacity=".85">
              <path d="M4.5 15.2 L5.7 16.3 V21.2 L4.5 22.0 Z"/>
              <path d="M27.5 15.2 L26.3 16.3 V21.2 L27.5 22.0 Z"/>
            </g>
          </g>
        </svg>
        <div class="eyebrow">Error 404</div>
        <h1>This wing is closed</h1>
        <div class="rule"></div>
        <p>
          There is nothing hanging at this address. The room may have been
          renamed, or the link may have lost a letter on the way here.
        </p>
        <a class="back" href="%SITE_URL%">Return to the entrance</a>
      </div>
    </main>
  </body>
</html>
